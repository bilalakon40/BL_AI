
services:
  api:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      - DATABASE_PATH=/app/data/trading.db
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-true}
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAX_DAILY_LOSS_PCT=${MAX_DAILY_LOSS_PCT:-0.05}
      - MAX_POSITION_PCT=${MAX_POSITION_PCT:-0.20}
      - KILL_SWITCH_LOSS_PCT=${KILL_SWITCH_LOSS_PCT:-0.15}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3}
      - ENV=production
    volumes:
      - api_data:/app/data
      - ./models:/app/models:ro
    restart: unless-stopped

  dashboard:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    depends_on:
      - api
    restart: unless-stopped

  telegram-bot:
    build: ./telegram-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://api:8000
      - ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
